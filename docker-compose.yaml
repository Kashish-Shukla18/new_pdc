# docker-compose.yaml – optional data services for the PDC
#
# Required for the live app today: timescaledb (PMU address book only).
# Redis is only needed when you re-enable the parked storage sink in output/.

version: '3.8'

services:

  # ── REDIS (parked storage sink — not required for live dashboard) ──────────
  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    command: >
      redis-server
        --maxmemory 2gb
        --maxmemory-policy allkeys-lru
        --tcp-backlog 511
        --hz 20
        --aof-use-rdb-preamble yes
        --save ""
        --appendonly no

  # ── POSTGRES + TIMESCALEDB (PMU address book; history table parked) ────────
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: pdc
      POSTGRES_PASSWORD: pdc
      POSTGRES_DB: pdc
    volumes:
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - timescaledb-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pdc -d pdc"]
      interval: 5s
      timeout: 5s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4:latest
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
    depends_on:
      timescaledb:
        condition: service_healthy

  # ── PROMETHEUS (optional app monitoring) ───────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.47.0
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro

volumes:
  timescaledb-data:
