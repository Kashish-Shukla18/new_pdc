# Usage:
#   set POSTGRES_PASSWORD in the environment (required), then:
#   docker compose up -d
#
# On the same host, PDC .env should use:
#   POSTGRES_DSN=postgres://pdc:<password>@127.0.0.1:5432/pdc?sslmode=disable

services:
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: pdc
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: pdc
    # Bind only to localhost — not reachable from the internet
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - timescaledb-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pdc -d pdc"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  timescaledb-data:
