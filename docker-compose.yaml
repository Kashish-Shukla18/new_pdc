# docker-compose.yaml – tuned for high-throughput PMU data ingestion

version: '3.8'

services:

  # ── KAFKA (message queue) ──────────────────────────────────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      - zookeeper
    ports:
      - "9093:9093"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT_INTERNAL://0.0.0.0:9092,PLAINTEXT_EXTERNAL://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT_INTERNAL://kafka:9092,PLAINTEXT_EXTERNAL://127.0.0.1:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT_INTERNAL:PLAINTEXT,PLAINTEXT_EXTERNAL:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      # ── Throughput tuning ─────────────────────────────────────────────────
      # Allow large batches; PMU data at 50fps × 20 PMUs ≈ 5-10 KB/s per partition
      KAFKA_MESSAGE_MAX_BYTES: "2097152"          # 2 MB max message
      KAFKA_REPLICA_FETCH_MAX_BYTES: "2097152"
      # Retention: keep 6 hours of data, capped at 10 GB per partition
      KAFKA_LOG_RETENTION_HOURS: "6"
      KAFKA_LOG_RETENTION_BYTES: "10737418240"    # 10 GB
      KAFKA_LOG_SEGMENT_BYTES: "104857600"        # 100 MB segments for faster cleanup
      KAFKA_LOG_CLEANUP_POLICY: "delete"
      # Network & I/O threads for higher concurrency
      KAFKA_NUM_NETWORK_THREADS: "4"
      KAFKA_NUM_IO_THREADS: "8"
      # Socket buffers
      KAFKA_SOCKET_SEND_BUFFER_BYTES: "1048576"   # 1 MB
      KAFKA_SOCKET_RECEIVE_BUFFER_BYTES: "1048576"
      KAFKA_SOCKET_REQUEST_MAX_BYTES: "2097152"
      # Reduce leader election timeout for faster recovery
      KAFKA_LEADER_IMBALANCE_CHECK_INTERVAL_SECONDS: "30"

  # ── REDIS (live state buffer) ──────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    command: >
      redis-server
        --maxmemory 2gb
        --maxmemory-policy allkeys-lru
        --tcp-backlog 511
        --hz 20
        --aof-use-rdb-preamble yes
        --save ""
        --appendonly no

  # ── INFLUXDB (time-series storage) ────────────────────────────────────────
  influxdb:
    image: influxdb:2.7
    ports:
      - "8087:8086"
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: admin
      DOCKER_INFLUXDB_INIT_PASSWORD: admin123456
      DOCKER_INFLUXDB_INIT_ORG: pdc-org
      DOCKER_INFLUXDB_INIT_BUCKET: synchrophasor
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: my-super-secret-token
      # Storage engine concurrency
      INFLUXD_STORAGE_WAL_MAX_CONCURRENT_WRITES: "8"
      INFLUXD_STORAGE_WAL_FSYNC_DELAY: "100ms"
      # HTTP limits – allow larger batch payloads
      INFLUXD_HTTP_MAX_BODY_SIZE: "52428800"      # 50 MB
      INFLUXD_QUERY_CONCURRENCY: "20"
    volumes:
      - influxdb-data:/var/lib/influxdb2

  # ── GRAFANA (dashboard) ────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:10.2.0
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin123
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - influxdb

  # ── PROMETHEUS (app monitoring) ────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.47.0
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro

volumes:
  influxdb-data:
  grafana-data:
